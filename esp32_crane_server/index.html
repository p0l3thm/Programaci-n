<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Grúa Torre</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --btn-bg: #1e293b;
            --btn-hover: #334155;
            --btn-active: #3b82f6;
            --text-color: #f8fafc;
            --danger: #ef4444;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }
        h1 { margin-bottom: 30px; font-weight: 300; letter-spacing: 2px; }
        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 15px;
            margin-bottom: 40px;
        }
        .btn {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn:active, .btn.active {
            background-color: var(--btn-active);
            transform: scale(0.95);
            box-shadow: 0 0 15px var(--btn-active);
        }
        .btn.stop { grid-column: 2; grid-row: 2; background-color: var(--danger); font-size: 16px; font-weight: bold; }
        .btn.up { grid-column: 2; grid-row: 1; }
        .btn.down { grid-column: 2; grid-row: 3; }
        .btn.left { grid-column: 1; grid-row: 2; }
        .btn.right { grid-column: 3; grid-row: 2; }
        
        .elevacion-controls {
            display: flex;
            gap: 20px;
        }
        .elevacion-controls .btn { width: 80px; height: 80px; }
        .label { margin-bottom: 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; text-align: center;}
    </style>
</head>
<body>

    <h1>GRÚA TORRE</h1>

    <div class="label">Traslación y Giro</div>
    <div class="control-grid">
        <button class="btn up" data-cmd="F">▲</button>
        <button class="btn left" data-cmd="L">◀</button>
        <button class="btn stop" data-cmd="S">STOP</button>
        <button class="btn right" data-cmd="R">▶</button>
        <button class="btn down" data-cmd="B">▼</button>
    </div>

    <div class="label">Elevación</div>
    <div class="elevacion-controls">
        <button class="btn" data-cmd="U">▲<br>Subir</button>
        <button class="btn" data-cmd="D">▼<br>Bajar</button>
    </div>

    <script>
        let intervalId = null;
        let activeCmd = 'S';

        const sendCommand = async (cmd) => {
            try {
                await fetch(`/api/control?cmd=${cmd}`, { method: 'GET' });
            } catch (e) {
                console.error("Error sending command", e);
            }
        };

        const startAction = (cmd) => {
            if(intervalId) clearInterval(intervalId);
            activeCmd = cmd;
            sendCommand(cmd);
            // Send command repeatedly every 200ms to avoid timeout
            intervalId = setInterval(() => sendCommand(cmd), 200);
        };

        const stopAction = () => {
            if(intervalId) clearInterval(intervalId);
            activeCmd = 'S';
            sendCommand('S');
        };

        document.querySelectorAll('.btn').forEach(btn => {
            const cmd = btn.getAttribute('data-cmd');
            
            // Touch events for mobile
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); startAction(cmd); btn.classList.add('active'); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); stopAction(); btn.classList.remove('active'); });
            
            // Mouse events for desktop
            btn.addEventListener('mousedown', () => { startAction(cmd); btn.classList.add('active'); });
            btn.addEventListener('mouseup', () => { stopAction(); btn.classList.remove('active'); });
            btn.addEventListener('mouseleave', () => { 
                if(btn.classList.contains('active')) {
                    stopAction(); 
                    btn.classList.remove('active'); 
                }
            });
        });
    </script>
</body>
</html>
